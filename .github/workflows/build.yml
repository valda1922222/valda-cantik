name: Build VIIBE Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          echo "Memeriksa file proyek..."
          find . -maxdepth 4 -type f

      - name: Build status
        run: |
          echo "Workflow aktif."
          echo "Source aplikasi harus ditambahkan sebelum APK dapat dibuat."
